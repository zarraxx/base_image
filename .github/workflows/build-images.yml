name: Build And Publish Base Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "centos/**"
      - "debian/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "centos/**"
      - "debian/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Select which image to build
        required: true
        default: all
        type: choice
        options:
          - all
          - centos-aliyun
          - centos-devtoolset10
          - debian-10-aliyun

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: centos-aliyun
            image: centos
            tag: aliyun
            file: centos/aliyun/Dockerfile
          - id: centos-devtoolset10
            image: centos
            tag: devtoolset10
            file: centos/devtoolset/Dockerfile
          - id: debian-10-aliyun
            image: debian
            tag: 10-aliyun
            file: debian/10/aliyun/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}
