name: Build osxcross Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ubuntu/24.04/osxcross/**"
      - ".github/workflows/build-osxcross.yml"
  pull_request:
    paths:
      - "ubuntu/24.04/osxcross/**"
      - ".github/workflows/build-osxcross.yml"
  workflow_dispatch:
    inputs:
      osx_sdk_version:
        description: macOS SDK version
        required: true
        default: "11.3"
        type: string

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_REPOSITORY: registry.cn-hangzhou.aliyuncs.com/zarra/osxcross
  OSX_SDK_VERSION: ${{ github.event.inputs.osx_sdk_version || '11.3' }}
  DARLING_IMAGE: ghcr.io/zarraxx/darling:noble-20260608

permissions:
  contents: read

concurrency:
  group: build-osxcross-${{ github.ref }}-${{ github.event.inputs.osx_sdk_version || '11.3' }}
  cancel-in-progress: true

jobs:
  build:
    name: osxcross-MacOSX${{ github.event.inputs.osx_sdk_version || '11.3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          tag="MacOSX${OSX_SDK_VERSION}"
          echo "local=osxcross:${tag}" >> "${GITHUB_OUTPUT}"
          echo "remote=${IMAGE_REPOSITORY}:${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        working-directory: ubuntu/24.04/osxcross
        run: ./build.sh "${OSX_SDK_VERSION}"

      - name: Test image
        working-directory: ubuntu/24.04/osxcross
        run: ./test.sh "${{ steps.image.outputs.local }}" "${DARLING_IMAGE}"

      - name: Log in to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login \
            --username="${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin \
            "${REGISTRY}"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${{ steps.image.outputs.local }}" "${{ steps.image.outputs.remote }}"
          docker push "${{ steps.image.outputs.remote }}"
