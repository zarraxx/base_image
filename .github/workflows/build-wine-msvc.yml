name: Build Wine MSVC Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "debian/12/wine-msvc/**"
      - ".github/workflows/build-wine-msvc.yml"
  pull_request:
    paths:
      - "debian/12/wine-msvc/**"
      - ".github/workflows/build-wine-msvc.yml"
  workflow_dispatch:

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/zarra/wine:msvc

permissions:
  contents: read

concurrency:
  group: build-wine-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: wine-msvc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        working-directory: debian/12/wine-msvc
        run: ./build.sh "${IMAGE_NAME}"

      - name: Test image
        working-directory: debian/12/wine-msvc
        run: ./test.sh "${IMAGE_NAME}"

      - name: Log in to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login \
            --username="${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin \
            "${REGISTRY}"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_NAME}"
