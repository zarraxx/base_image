name: Build OpenJDK Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "openjdk/Dockerfile"
      - "openjdk/loong64/**"
      - "openjdk/riscv64/**"
      - "debian/13/loong64/**"
      - "ubuntu/Dockerfile"
      - ".github/workflows/build-openjdk.yml"
  pull_request:
    paths:
      - "openjdk/Dockerfile"
      - "openjdk/loong64/**"
      - "openjdk/riscv64/**"
      - "debian/13/loong64/**"
      - "ubuntu/Dockerfile"
      - ".github/workflows/build-openjdk.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openjdk
  RELEASE_TAG: loong64-openjdk-debs
  RISCV64_RELEASE_TAG: riscv64-openjdk8-debs

permissions:
  contents: write
  packages: write

concurrency:
  group: build-openjdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-official:
    name: openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            target:
              suffix: amd64
              platform: linux/amd64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "8"
            target:
              suffix: arm64v8
              platform: linux/arm64/v8
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "8"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "8"
            target:
              suffix: s390x
              platform: linux/s390x
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "8"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_image: ghcr.io/zarraxx/debian:buster-mips64el
              stretch_openjdk8: "true"
          - java: "11"
            target:
              suffix: amd64
              platform: linux/amd64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: arm64v8
              platform: linux/arm64/v8
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: s390x
              platform: linux/s390x
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_image: ghcr.io/zarraxx/debian:buster-mips64el
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: amd64
              platform: linux/amd64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: arm64v8
              platform: linux/arm64/v8
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: s390x
              platform: linux/s390x
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_image: ghcr.io/zarraxx/debian:bookworm-mips64el
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: amd64
              platform: linux/amd64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: arm64v8
              platform: linux/arm64/v8
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: s390x
              platform: linux/s390x
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: amd64
              platform: linux/amd64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: arm64v8
              platform: linux/arm64/v8
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: s390x
              platform: linux/s390x
              base_image: ghcr.io/zarraxx/ubuntu:resolute
              stretch_openjdk8: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          openjdk_image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          echo "tag=${openjdk_image}:${{ matrix.java }}-${{ matrix.target.suffix }}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local smoke image
        shell: bash
        run: |
          docker build \
            --platform "${{ matrix.target.platform }}" \
            -f openjdk/Dockerfile \
            -t "localhost/${IMAGE_NAME}:${{ matrix.java }}-${{ matrix.target.suffix }}-smoke" \
            --build-arg "BASE_IMAGE=${{ matrix.target.base_image }}" \
            --build-arg "JAVA_VERSION=${{ matrix.java }}" \
            --build-arg "ENABLE_STRETCH_OPENJDK8=${{ matrix.target.stretch_openjdk8 }}" \
            .

      - name: Smoke test local image
        shell: bash
        run: |
          local_tag="localhost/${IMAGE_NAME}:${{ matrix.java }}-${{ matrix.target.suffix }}-smoke"
          if ! docker run --rm --platform "${{ matrix.target.platform }}" "${local_tag}" /bin/sh -lc 'java -version && javac -version'; then
            echo "::warning::openjdk ${{ matrix.java }}-${{ matrix.target.suffix }} smoke test failed; continuing"
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: openjdk/Dockerfile
          platforms: ${{ matrix.target.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ matrix.target.base_image }}
            JAVA_VERSION=${{ matrix.java }}
            ENABLE_STRETCH_OPENJDK8=${{ matrix.target.stretch_openjdk8 }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}
          cache-to: type=gha,mode=max,scope=openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}

  build-loong64:
    name: openjdk-loong64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Debian loong64 base
        working-directory: debian/13/loong64
        env:
          CONTAINER_TOOL: docker
        run: ./build.sh

      - name: Cache Loongnix OpenJDK tarballs
        uses: actions/cache@v4
        with:
          path: openjdk/loong64/.cache
          key: loong64-openjdk-tarballs-${{ hashFiles('openjdk/loong64/*/package.conf') }}
          restore-keys: |
            loong64-openjdk-tarballs-

      - name: Build loong64 OpenJDK debs
        working-directory: openjdk/loong64
        run: ./build.sh

      - name: Test loong64 OpenJDK debs
        working-directory: openjdk/loong64
        env:
          IMAGE: localhost/debian:trixie-loong64
          ALLOW_RUNTIME_FAILURE: "true"
        run: |
          if ! ./test.sh; then
            echo "::warning::loong64 OpenJDK deb test failed; continuing"
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Build and optionally push loong64 OpenJDK images
        shell: bash
        run: |
          set -euo pipefail

          for version in 8 11 17 21 25; do
            build_dir="$(mktemp -d)"
            deb="$(ls "openjdk/loong64/dist/openjdk-${version}-jdk_"*_loong64.deb)"
            cp "${deb}" "${build_dir}/openjdk.deb"
            cat > "${build_dir}/Dockerfile" <<'EOF'
          FROM localhost/debian:trixie-loong64
          COPY openjdk.deb /tmp/openjdk.deb
          RUN apt-get update && \
              apt-get install -y --no-install-recommends /tmp/openjdk.deb && \
              rm -f /tmp/openjdk.deb && \
              rm -rf /var/lib/apt/lists/*
          CMD ["java", "-version"]
          EOF

            local_tag="localhost/${IMAGE_NAME}:${version}-loong64"
            remote_tag="${{ steps.image.outputs.repo }}:${version}-loong64"
            docker build --platform linux/loong64 -t "${local_tag}" "${build_dir}"
            smoke_env=()
            if [[ "${version}" == "8" ]]; then
              smoke_env=(-e JAVA_TOOL_OPTIONS=-Xint)
            fi
            if ! docker run --rm --platform linux/loong64 "${smoke_env[@]}" "${local_tag}" /bin/sh -lc 'java -version && javac -version'; then
              echo "::warning::openjdk ${version} loong64 JVM smoke test failed on GitHub QEMU; continuing"
            fi

            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              docker tag "${local_tag}" "${remote_tag}"
              docker push "${remote_tag}"
            fi

            rm -rf "${build_dir}"
          done

      - name: Upload loong64 deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: loong64-openjdk-debs
          path: openjdk/loong64/dist/*.deb
          if-no-files-found: error

      - name: Release loong64 deb packages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          notes="$(mktemp)"
          cat > "${notes}" <<'EOF'
          Loongnix OpenJDK binary tarballs repacked as Debian loong64 packages.

          Packages:
          - openjdk-8-jdk
          - openjdk-11-jdk
          - openjdk-17-jdk
          - openjdk-21-jdk
          - openjdk-25-jdk
          EOF

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "${tag}" --notes-file "${notes}"

          gh release upload "${tag}" openjdk/loong64/dist/*.deb --clobber

  build-riscv64-jdk8:
    name: openjdk-8-riscv64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio zstd

      - name: Cache openSUSE OpenJDK riscv64 RPMs
        uses: actions/cache@v4
        with:
          path: openjdk/riscv64/.cache
          key: riscv64-openjdk8-rpms-${{ hashFiles('openjdk/riscv64/8/package.conf') }}
          restore-keys: |
            riscv64-openjdk8-rpms-

      - name: Build riscv64 OpenJDK 8 deb
        working-directory: openjdk/riscv64
        run: ./build.sh

      - name: Test riscv64 OpenJDK 8 deb
        working-directory: openjdk/riscv64
        env:
          IMAGE: ghcr.io/zarraxx/ubuntu:resolute
        run: |
          if ! ./test.sh; then
            echo "::warning::riscv64 OpenJDK 8 deb test failed; continuing"
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Build and optionally push riscv64 OpenJDK 8 image
        shell: bash
        run: |
          set -euo pipefail

          build_dir="$(mktemp -d)"
          deb="$(ls openjdk/riscv64/dist/openjdk-8-jdk_*_riscv64.deb)"
          cp "${deb}" "${build_dir}/openjdk.deb"
          cat > "${build_dir}/Dockerfile" <<'EOF'
          FROM ghcr.io/zarraxx/ubuntu:resolute
          COPY openjdk.deb /tmp/openjdk.deb
          RUN apt-get update && \
              apt-get install -y --no-install-recommends /tmp/openjdk.deb && \
              rm -f /tmp/openjdk.deb && \
              rm -rf /var/lib/apt/lists/*
          CMD ["java", "-version"]
          EOF

          local_tag="localhost/${IMAGE_NAME}:8-riscv64"
          remote_tag="${{ steps.image.outputs.repo }}:8-riscv64"
          docker build --platform linux/riscv64 -t "${local_tag}" "${build_dir}"
          if ! docker run --rm --platform linux/riscv64 "${local_tag}" /bin/sh -lc 'java -version && javac -version'; then
            echo "::warning::openjdk 8-riscv64 JVM smoke test failed; continuing"
          fi

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker tag "${local_tag}" "${remote_tag}"
            docker push "${remote_tag}"
          fi

          rm -rf "${build_dir}"

      - name: Upload riscv64 deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-openjdk8-deb
          path: openjdk/riscv64/dist/*.deb
          if-no-files-found: error

      - name: Release riscv64 OpenJDK 8 deb package
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RISCV64_RELEASE_TAG}"
          notes="$(mktemp)"
          cat > "${notes}" <<'EOF'
          openSUSE Tumbleweed OpenJDK 8 riscv64 RPM packages repacked as a Debian riscv64 package.

          Package:
          - openjdk-8-jdk

          Source RPM repository:
          - https://download.opensuse.org/ports/riscv/tumbleweed/repo/oss/riscv64/
          EOF

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "${tag}" --notes-file "${notes}"

          gh release upload "${tag}" openjdk/riscv64/dist/*.deb --clobber

  publish-manifest:
    name: openjdk-manifest
    runs-on: ubuntu-latest
    needs:
      - build-official
      - build-loong64
      - build-riscv64-jdk8
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            arch_tags: amd64 arm64v8 ppc64le riscv64 s390x mips64le loong64
          - java: "11"
            arch_tags: amd64 arm64v8 ppc64le riscv64 s390x mips64le loong64
          - java: "17"
            arch_tags: amd64 arm64v8 ppc64le riscv64 s390x mips64le loong64
          - java: "21"
            arch_tags: amd64 arm64v8 ppc64le riscv64 s390x loong64
          - java: "25"
            arch_tags: amd64 arm64v8 ppc64le riscv64 s390x loong64

    steps:
      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Publish OpenJDK manifest tag
        shell: bash
        run: |
          image="${{ steps.image.outputs.image }}"
          version="${{ matrix.java }}"
          refs=()
          for arch in ${{ matrix.arch_tags }}; do
            refs+=("${image}:${version}-${arch}")
          done
          docker buildx imagetools create --tag "${image}:${version}" "${refs[@]}"
