name: Build OpenJDK Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "openjdk/Dockerfile"
      - "openjdk/loong64/**"
      - "debian/10/rootfs/**"
      - "debian/13/loong64/**"
      - "debian/13/Dockerfile"
      - "debian/12/rootfs/**"
      - ".github/workflows/build-openjdk.yml"
  pull_request:
    paths:
      - "openjdk/Dockerfile"
      - "openjdk/loong64/**"
      - "debian/10/rootfs/**"
      - "debian/13/loong64/**"
      - "debian/13/Dockerfile"
      - "debian/12/rootfs/**"
      - ".github/workflows/build-openjdk.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openjdk
  DEBIAN_IMAGE_NAME: debian
  RELEASE_TAG: loong64-openjdk-debs

permissions:
  contents: write
  packages: write

concurrency:
  group: build-openjdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-official:
    name: openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            target:
              suffix: amd64
              platform: linux/amd64
              base_tag: buster-amd64
              stretch_openjdk8: "true"
          - java: "8"
            target:
              suffix: aarch64
              platform: linux/arm64/v8
              base_tag: buster-aarch64
              stretch_openjdk8: "true"
          - java: "8"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_tag: buster-ppc64el
              stretch_openjdk8: "true"
          - java: "8"
            target:
              suffix: s390x
              platform: linux/s390x
              base_tag: buster-s390x
              stretch_openjdk8: "true"
          - java: "8"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_tag: buster-mips64el
              stretch_openjdk8: "true"
          - java: "11"
            target:
              suffix: amd64
              platform: linux/amd64
              base_tag: buster-amd64
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: aarch64
              platform: linux/arm64/v8
              base_tag: buster-aarch64
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_tag: buster-ppc64el
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: s390x
              platform: linux/s390x
              base_tag: buster-s390x
              stretch_openjdk8: "false"
          - java: "11"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_tag: buster-mips64el
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: amd64
              platform: linux/amd64
              base_tag: bookworm-amd64
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: aarch64
              platform: linux/arm64/v8
              base_tag: bookworm-aarch64
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_tag: bookworm-ppc64el
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: s390x
              platform: linux/s390x
              base_tag: bookworm-s390x
              stretch_openjdk8: "false"
          - java: "17"
            target:
              suffix: mips64le
              platform: linux/mips64le
              base_tag: bookworm-mips64el
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: amd64
              platform: linux/amd64
              base_tag: trixie-amd64
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: aarch64
              platform: linux/arm64/v8
              base_tag: trixie-arm64v8
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_tag: trixie-ppc64le
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_tag: trixie-riscv64
              stretch_openjdk8: "false"
          - java: "21"
            target:
              suffix: s390x
              platform: linux/s390x
              base_tag: trixie-s390x
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: amd64
              platform: linux/amd64
              base_tag: trixie-amd64
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: aarch64
              platform: linux/arm64/v8
              base_tag: trixie-arm64v8
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: ppc64le
              platform: linux/ppc64le
              base_tag: trixie-ppc64le
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: riscv64
              platform: linux/riscv64
              base_tag: trixie-riscv64
              stretch_openjdk8: "false"
          - java: "25"
            target:
              suffix: s390x
              platform: linux/s390x
              base_tag: trixie-s390x
              stretch_openjdk8: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          openjdk_image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          debian_image="${REGISTRY}/${owner}/${DEBIAN_IMAGE_NAME}"
          {
            echo "tag=${openjdk_image}:${{ matrix.java }}-${{ matrix.target.suffix }}"
            echo "base=${debian_image}:${{ matrix.target.base_tag }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: openjdk/Dockerfile
          platforms: ${{ matrix.target.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base }}
            JAVA_VERSION=${{ matrix.java }}
            ENABLE_STRETCH_OPENJDK8=${{ matrix.target.stretch_openjdk8 }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}
          cache-to: type=gha,mode=max,scope=openjdk-${{ matrix.java }}-${{ matrix.target.suffix }}

  build-loong64:
    name: openjdk-loong64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Debian loong64 base
        working-directory: debian/13/loong64
        env:
          CONTAINER_TOOL: docker
        run: ./build.sh

      - name: Cache Loongnix OpenJDK tarballs
        uses: actions/cache@v4
        with:
          path: openjdk/loong64/.cache
          key: loong64-openjdk-tarballs-${{ hashFiles('openjdk/loong64/*/package.conf') }}
          restore-keys: |
            loong64-openjdk-tarballs-

      - name: Build loong64 OpenJDK debs
        working-directory: openjdk/loong64
        run: ./build.sh

      - name: Test loong64 OpenJDK debs
        working-directory: openjdk/loong64
        env:
          IMAGE: localhost/debian:trixie-loong64
          SKIP_OPENJDK8_RUNTIME: "true"
        run: ./test.sh

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Build and optionally push loong64 OpenJDK images
        shell: bash
        run: |
          set -euo pipefail

          for version in 8 11 17 21 25; do
            build_dir="$(mktemp -d)"
            deb="$(ls "openjdk/loong64/dist/openjdk-${version}-jdk_"*_loong64.deb)"
            cp "${deb}" "${build_dir}/openjdk.deb"
            cat > "${build_dir}/Dockerfile" <<'EOF'
          FROM localhost/debian:trixie-loong64
          COPY openjdk.deb /tmp/openjdk.deb
          RUN apt-get update && \
              apt-get install -y --no-install-recommends /tmp/openjdk.deb && \
              rm -f /tmp/openjdk.deb && \
              rm -rf /var/lib/apt/lists/*
          CMD ["java", "-version"]
          EOF

            local_tag="localhost/${IMAGE_NAME}:${version}-loong64"
            remote_tag="${{ steps.image.outputs.repo }}:${version}-loong64"
            docker build --platform linux/loong64 -t "${local_tag}" "${build_dir}"
            if [[ "${version}" == "8" ]]; then
              docker run --rm --platform linux/loong64 "${local_tag}" /bin/sh -lc 'test -x /usr/lib/jvm/loongson-8-jdk-loong64/bin/java && test -x /usr/lib/jvm/loongson-8-jdk-loong64/bin/javac'
            else
              docker run --rm --platform linux/loong64 "${local_tag}" /bin/sh -lc 'java -version && javac -version'
            fi

            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              docker tag "${local_tag}" "${remote_tag}"
              docker push "${remote_tag}"
            fi

            rm -rf "${build_dir}"
          done

      - name: Upload loong64 deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: loong64-openjdk-debs
          path: openjdk/loong64/dist/*.deb
          if-no-files-found: error

      - name: Release loong64 deb packages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          notes="$(mktemp)"
          cat > "${notes}" <<'EOF'
          Loongnix OpenJDK binary tarballs repacked as Debian loong64 packages.

          Packages:
          - openjdk-8-jdk
          - openjdk-11-jdk
          - openjdk-17-jdk
          - openjdk-21-jdk
          - openjdk-25-jdk
          EOF

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "${tag}" --notes-file "${notes}"

          gh release upload "${tag}" openjdk/loong64/dist/*.deb --clobber

  publish-manifest:
    name: openjdk-manifest
    runs-on: ubuntu-latest
    needs:
      - build-official
      - build-loong64
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            arch_tags: amd64 aarch64 ppc64le s390x mips64le
          - java: "11"
            arch_tags: amd64 aarch64 ppc64le s390x mips64le
          - java: "17"
            arch_tags: amd64 aarch64 ppc64le s390x mips64le
          - java: "21"
            arch_tags: amd64 aarch64 ppc64le riscv64 s390x
          - java: "25"
            arch_tags: amd64 aarch64 ppc64le riscv64 s390x

    steps:
      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Publish OpenJDK manifest tag
        shell: bash
        run: |
          image="${{ steps.image.outputs.image }}"
          version="${{ matrix.java }}"
          refs=()
          for arch in ${{ matrix.arch_tags }}; do
            refs+=("${image}:${version}-${arch}")
          done
          docker buildx imagetools create --tag "${image}:${version}" "${refs[@]}"
