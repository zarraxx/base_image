name: Build Debian 13 Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "debian/13/**"
      - ".github/workflows/build-debian-13.yml"
  pull_request:
    paths:
      - "debian/13/**"
      - ".github/workflows/build-debian-13.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: debian
  IMAGE_TAG_TRIXIE: trixie
  IMAGE_TAG_13: "13"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-debian-13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-official:
    name: debian-13-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: amd64
            platform: linux/amd64
          - suffix: arm32v7
            platform: linux/arm/v7
          - suffix: arm64v8
            platform: linux/arm64/v8
          - suffix: mips64le
            platform: linux/mips64le
          - suffix: ppc64le
            platform: linux/ppc64le
          - suffix: riscv64
            platform: linux/riscv64
          - suffix: s390x
            platform: linux/s390x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${REGISTRY}/${owner}/${IMAGE_NAME}:${IMAGE_TAG_TRIXIE}-${{ matrix.suffix }}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: debian/13/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=debian-13-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=debian-13-${{ matrix.suffix }}

  build-loong64:
    name: debian-13-loong64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "local=localhost/${IMAGE_NAME}:${IMAGE_TAG_TRIXIE}-loong64" >> "${GITHUB_OUTPUT}"
          echo "remote=${REGISTRY}/${owner}/${IMAGE_NAME}:${IMAGE_TAG_TRIXIE}-loong64" >> "${GITHUB_OUTPUT}"

      - name: Build loong64 image
        working-directory: debian/13/loong64
        run: ./build.sh

      - name: Test loong64 image
        run: docker run --rm --platform linux/loong64 "${{ steps.image.outputs.local }}" /bin/sh -lc 'uname -m && python3 --version && git --version'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push loong64 image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${{ steps.image.outputs.local }}" "${{ steps.image.outputs.remote }}"
          docker push "${{ steps.image.outputs.remote }}"

  publish-manifest:
    name: debian-13-manifest
    runs-on: ubuntu-latest
    needs:
      - build-official
      - build-loong64
    if: github.event_name != 'pull_request'

    steps:
      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest tags
        run: |
          image="${{ steps.image.outputs.image }}"
          docker buildx imagetools create \
            --tag "${image}:${IMAGE_TAG_TRIXIE}" \
            --tag "${image}:${IMAGE_TAG_13}" \
            "${image}:${IMAGE_TAG_TRIXIE}-amd64" \
            "${image}:${IMAGE_TAG_TRIXIE}-arm32v7" \
            "${image}:${IMAGE_TAG_TRIXIE}-arm64v8" \
            "${image}:${IMAGE_TAG_TRIXIE}-mips64le" \
            "${image}:${IMAGE_TAG_TRIXIE}-ppc64le" \
            "${image}:${IMAGE_TAG_TRIXIE}-riscv64" \
            "${image}:${IMAGE_TAG_TRIXIE}-s390x" \
            "${image}:${IMAGE_TAG_TRIXIE}-loong64"
