name: Debian 10

on:
  push:
    branches:
      - main
      - master
    paths:
      - "debian/10/**"
      - ".github/workflows/debian-10.yml"
  pull_request:
    paths:
      - "debian/10/**"
      - ".github/workflows/debian-10.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: debian
  IMAGE_TAG_BUSTER: buster
  IMAGE_TAG_10: "10"

permissions:
  contents: read
  packages: write

concurrency:
  group: debian-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rootfs:
    name: debian-10-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: amd64
            debian_arch: amd64
            platform: linux/amd64
          - suffix: armv7
            debian_arch: armhf
            platform: linux/arm/v7
          - suffix: aarch64
            debian_arch: arm64
            platform: linux/arm64
          - suffix: mips64el
            debian_arch: mips64el
            platform: linux/mips64le
          - suffix: ppc64el
            debian_arch: ppc64el
            platform: linux/ppc64le
          - suffix: s390x
            debian_arch: s390x
            platform: linux/s390x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          {
            echo "image=${image}"
            echo "local=localhost/${IMAGE_NAME}:${IMAGE_TAG_BUSTER}-${{ matrix.suffix }}"
            echo "remote=${image}:${IMAGE_TAG_BUSTER}-${{ matrix.suffix }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build rootfs image
        working-directory: debian/10/rootfs
        env:
          CONTAINER_TOOL: docker
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          IMAGE_TAG: ${{ steps.image.outputs.local }}
        run: ./build.sh

      - name: Test image
        run: docker run --rm --platform "${{ matrix.platform }}" "${{ steps.image.outputs.local }}" /bin/sh -lc 'uname -m && python3 --version && git --version'

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${{ steps.image.outputs.local }}" "${{ steps.image.outputs.remote }}"
          docker push "${{ steps.image.outputs.remote }}"

  publish-manifest:
    name: debian-10-manifest
    runs-on: ubuntu-latest
    needs:
      - build-rootfs
    if: github.event_name != 'pull_request'

    steps:
      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_KEY }}

      - name: Publish manifest tags
        run: |
          image="${{ steps.image.outputs.image }}"
          docker buildx imagetools create \
            --tag "${image}:${IMAGE_TAG_10}" \
            --tag "${image}:${IMAGE_TAG_BUSTER}" \
            "${image}:${IMAGE_TAG_BUSTER}-amd64" \
            "${image}:${IMAGE_TAG_BUSTER}-armv7" \
            "${image}:${IMAGE_TAG_BUSTER}-aarch64" \
            "${image}:${IMAGE_TAG_BUSTER}-mips64el" \
            "${image}:${IMAGE_TAG_BUSTER}-ppc64el" \
            "${image}:${IMAGE_TAG_BUSTER}-s390x"
