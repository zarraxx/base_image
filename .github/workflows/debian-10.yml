name: Debian 10

on:
  push:
    branches:
      - main
      - master
    paths:
      - debian/10/**
      - .github/workflows/debian-10.yml
  pull_request:
    paths:
      - debian/10/**
      - .github/workflows/debian-10.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zarraxx/debian

jobs:
  build:
    name: Build Debian 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm,arm64,mips64le,ppc64le,s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_KEY || github.token }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: debian/10/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
            linux/mips64le
            linux/ppc64le
            linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:10
            ${{ env.IMAGE_NAME }}:buster
